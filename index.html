<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamptons New York</title>
<meta name="description" content="Hamptons New York">
<meta property="og:title" content="Hamptons New York">
<meta property="og:site_name" content="Hamptons New York">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hamptonsnewyork.com/">
<meta property="og:image" content="https://hamptonsnewyork.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hamptonsnewyork.com/og.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .logo {
    width: 140px;
    height: 140px;
    opacity: 0;
    animation: fadeIn 30s ease-in forwards;
  }
  .mark {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    width: min(150px, 42vw);
    opacity: 0;
    animation: fadeIn 30s ease-in forwards;
  }
  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
  <img src="logo.png" alt="Hamptons New York" class="logo">
  <img src="footer-mark.png" alt="Hamptons New York, Made in America" class="mark">
</body>
</html>
